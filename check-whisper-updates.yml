# Monthly: is there a whisper.cpp release newer than the newest build published here?
# Only reports (job summary + a notice on the Actions page). Never builds or publishes anything.

name: Check for whisper.cpp updates

on:
  schedule:
    - cron: "17 2 1 * *"   # 1st of each month, 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compare versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          upstream=$(gh api repos/ggml-org/whisper.cpp/releases/latest --jq .tag_name)
          ours=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' \
                 | sed -n 's/^whisper-vulkan-//p' | sort -V | tail -n 1)
          ours=${ours:-none}
          echo "Upstream whisper.cpp: $upstream · Newest build here: $ours"
          {
            echo "### whisper.cpp update check"
            echo "| | Version |"
            echo "|---|---|"
            echo "| Latest whisper.cpp release | \`$upstream\` |"
            echo "| Newest build in this repo | \`$ours\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          newest=$(printf '%s\n%s\n' "$upstream" "$ours" | grep -v '^none$' | sort -V | tail -n 1)
          if [ "$ours" = "none" ] || { [ "$newest" = "$upstream" ] && [ "$upstream" != "$ours" ]; }; then
            echo "::notice title=whisper.cpp $upstream is available::Run 'Build whisper.cpp (Vulkan, Windows)' with whisper_tag=$upstream. Test it with KoalaCut before pointing the app at it."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Update available:** run *Build whisper.cpp (Vulkan, Windows)* with \`whisper_tag = $upstream\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Up to date." >> "$GITHUB_STEP_SUMMARY"
          fi
