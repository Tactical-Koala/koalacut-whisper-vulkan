# Builds whisper.cpp with Vulkan GPU support for Windows x64 (unofficial build, made for KoalaCut).
#
# One zip covers every PC:
#   - AMD / Intel / NVIDIA graphics -> Vulkan backend (ggml-vulkan.dll), using the normal graphics driver
#   - No usable GPU / old driver    -> CPU backend, best variant picked at run time (ggml-cpu-*.dll)
#
# Run: Actions -> "Build whisper.cpp (Vulkan, Windows)" -> Run workflow.
# Output: the zip + .sha256 as a run artifact and, with "publish" ticked, a GitHub Release tagged
#         whisper-vulkan-<tag> with a build-provenance attestation.

name: Build whisper.cpp (Vulkan, Windows)

on:
  workflow_dispatch:
    inputs:
      whisper_tag:
        description: "whisper.cpp release tag to build (e.g. v1.9.5)"
        default: "v1.9.5"
        required: true
      vulkan_sdk:
        description: "LunarG Vulkan SDK version (build-time only, not shipped)"
        default: "1.4.357.0"
        required: true
      publish:
        description: "Create a GitHub Release with the zip"
        type: boolean
        default: false

permissions:
  contents: write       # create the release
  id-token: write       # build-provenance attestation
  attestations: write

concurrency:
  group: build-${{ inputs.whisper_tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      WHISPER_TAG: ${{ inputs.whisper_tag }}
      VULKAN_VERSION: ${{ inputs.vulkan_sdk }}
      PKG: whisper-vulkan-win-x64-${{ inputs.whisper_tag }}
      RELEASE_TAG: whisper-vulkan-${{ inputs.whisper_tag }}

    steps:
      - name: Check inputs
        shell: pwsh
        run: |
          if ($env:WHISPER_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "whisper_tag must look like v1.9.5 (got '$env:WHISPER_TAG')" }
          if ($env:VULKAN_VERSION -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw "vulkan_sdk must look like 1.4.357.0 (got '$env:VULKAN_VERSION')" }
          if ('${{ inputs.publish }}' -eq 'true') {
            gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
            if ($LASTEXITCODE -eq 0) { throw "Release $env:RELEASE_TAG already exists. Delete it first, or run without 'publish'." }
            $global:LASTEXITCODE = 0
          }
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Get whisper.cpp source (official repo, pinned tag)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ggml-org/whisper.cpp
          ref: ${{ inputs.whisper_tag }}
          path: whisper.cpp
          persist-credentials: false

      - name: Install Vulkan SDK (headers + shader compiler, build-time only)
        shell: pwsh
        run: |
          $url = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          $exe = "$env:RUNNER_TEMP\vulkansdk.exe"
          curl.exe -fL --retry 3 --retry-delay 10 -o $exe $url
          if ($LASTEXITCODE -ne 0) { throw "Could not download Vulkan SDK $env:VULKAN_VERSION - check the version at https://vulkan.lunarg.com/sdk/home" }
          Start-Process -FilePath $exe -ArgumentList '--accept-licenses', '--default-answer', '--confirm-command', 'install' -Wait -NoNewWindow
          $sdk = "C:\VulkanSDK\$env:VULKAN_VERSION"
          if (-not (Test-Path "$sdk\Bin\glslc.exe")) { throw "Vulkan SDK install failed: $sdk\Bin\glslc.exe not found" }
          Add-Content $env:GITHUB_ENV  "VULKAN_SDK=$sdk"
          Add-Content $env:GITHUB_PATH "$sdk\Bin"

      - name: Configure
        shell: pwsh
        working-directory: whisper.cpp
        run: >
          cmake -S . -B build -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=ON
          -DGGML_VULKAN=ON
          -DGGML_NATIVE=OFF
          -DGGML_BACKEND_DL=ON
          -DGGML_CPU_ALL_VARIANTS=ON
          -DWHISPER_BUILD_IS_DEV=OFF
          -DWHISPER_BUILD_TESTS=OFF
          -DWHISPER_SDL2=OFF

      - name: Build
        shell: pwsh
        working-directory: whisper.cpp
        run: cmake --build build --config Release -j 4

      - name: Package
        shell: pwsh
        run: |
          $bin = "whisper.cpp\build\bin\Release"
          $out = "$env:PKG"
          New-Item -ItemType Directory -Force $out | Out-Null
          foreach ($f in "whisper-cli.exe", "whisper-server.exe", "whisper-bench.exe") {
            if (Test-Path "$bin\$f") { Copy-Item "$bin\$f" $out }
          }
          Copy-Item "$bin\*.dll" $out
          Copy-Item "whisper.cpp\LICENSE" "$out\LICENSE-whisper.cpp.txt"

          # Microsoft Visual C++ runtime next to the programs (app-local), so PCs without the
          # VC++ Redistributable can still run it. Permitted by Microsoft's redistribution terms.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory -ErrorAction SilentlyContinue |
                 Sort-Object FullName | Select-Object -Last 1
          if ($crt) {
            Copy-Item "$crt\*.dll" $out
            Write-Host "Bundled VC++ runtime from $($crt.FullName)"
          } else {
            Write-Warning "VC++ runtime DLLs not found - users will need the VC++ Redistributable"
          }

          foreach ($f in "whisper-cli.exe", "whisper.dll", "ggml.dll", "ggml-base.dll", "ggml-vulkan.dll") {
            if (-not (Test-Path "$out\$f")) { throw "Missing $f in package" }
          }
          if (-not (Get-ChildItem "$out\ggml-cpu-*.dll")) { throw "No CPU backend DLLs in package" }

          $commit = git -C whisper.cpp rev-parse HEAD
          $lines = @(
            "whisper.cpp $env:WHISPER_TAG ($commit)",
            "Unofficial build for KoalaCut - https://github.com/$env:GITHUB_REPOSITORY",
            "Built:      $((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm')) UTC, GitHub Actions run $env:GITHUB_RUN_ID",
            "Backends:   Vulkan (AMD / Intel / NVIDIA) + CPU (variant auto-selected)",
            "Vulkan SDK: $env:VULKAN_VERSION (build-time only; users need only a normal graphics driver)",
            "Source:     https://github.com/ggml-org/whisper.cpp/tree/$env:WHISPER_TAG"
          )
          $lines | Set-Content "$out\BUILD-INFO.txt"
          Get-ChildItem $out | Format-Table Name, Length

      - name: Smoke test (CPU path, real transcription + JSON output)
        shell: pwsh
        run: |
          $exe = "$env:PKG\whisper-cli.exe"
          curl.exe -fL --retry 3 -o ggml-tiny.en.bin "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin"
          if ($LASTEXITCODE -ne 0) { throw "Could not download the test model" }
          # GitHub's runners have no GPU: this proves the CPU fallback and the JSON KoalaCut reads.
          & $exe -m ggml-tiny.en.bin -f whisper.cpp\samples\jfk.wav -ng -ojf -of jfk -pp 2>&1 | Tee-Object smoke.log
          if ($LASTEXITCODE -ne 0) { throw "whisper-cli failed ($LASTEXITCODE)" }
          $j = Get-Content jfk.json -Raw | ConvertFrom-Json
          $text = ($j.transcription | ForEach-Object { $_.text }) -join ' '
          Write-Host "Transcript: $text"
          if ($text -notmatch 'country') { throw "Unexpected transcript" }
          $tok = $j.transcription[0].tokens | Where-Object { $_.offsets } | Select-Object -First 1
          if (-not $tok -or $null -eq $tok.p) { throw "No token timings / probabilities in JSON" }
          if (-not (Select-String -Path smoke.log -Pattern 'vulkan' -Quiet)) { Write-Warning "Vulkan backend not mentioned in the log" }

      - name: Zip + checksum
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:PKG\*" -DestinationPath "$env:PKG.zip"
          $h = (Get-FileHash "$env:PKG.zip" -Algorithm SHA256).Hash.ToLower()
          "$h  $env:PKG.zip" | Set-Content -NoNewline "$env:PKG.zip.sha256"
          Write-Host "SHA256: $h"
          "**$env:PKG.zip** — SHA256 ``$h``" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Build-provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.PKG }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ env.PKG }}
          path: |
            ${{ env.PKG }}.zip
            ${{ env.PKG }}.zip.sha256

      - name: Publish GitHub Release
        if: ${{ inputs.publish }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = (Get-Content "$env:PKG\BUILD-INFO.txt") -join "`n"
          $notes += "`n`nVerify: ``gh attestation verify $env:PKG.zip --repo $env:GITHUB_REPOSITORY``"
          $notes | Set-Content notes.md
          gh release create $env:RELEASE_TAG "$env:PKG.zip" "$env:PKG.zip.sha256" `
            --repo $env:GITHUB_REPOSITORY `
            --title "whisper.cpp $env:WHISPER_TAG (Vulkan, Windows x64)" `
            --notes-file notes.md
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
